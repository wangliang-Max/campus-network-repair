apiVersion: apps/v1
kind: Deployment
metadata:
  name: g18-frontend
  namespace: enterprise-g18
spec:
  replicas: 2
  selector:
    matchLabels:
      app: g18-frontend
  template:
    metadata:
      labels:
        app: g18-frontend
    spec:
      containers:
        - name: frontend
          image: g18-web:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKEND_HOST
              valueFrom:
                configMapKeyRef:
                  name: g18-config
                  key: BACKEND_HOST
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: g18-frontend
  namespace: enterprise-g18
spec:
  selector:
    app: g18-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
