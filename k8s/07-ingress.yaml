apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: g18-ingress
  namespace: enterprise-g18
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: g18.course.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: g18-frontend
                port:
                  number: 80
