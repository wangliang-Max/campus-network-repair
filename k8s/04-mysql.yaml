apiVersion: apps/v1
kind: Deployment
metadata:
  name: g18-mysql
  namespace: enterprise-g18
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: g18-mysql
  template:
    metadata:
      labels:
        app: g18-mysql
    spec:
      initContainers:
        - name: copy-sql
          image: busybox:1.36
          command: ["sh", "-c", "cp /sql/*.sql /initdb/"]
          volumeMounts:
            - name: sql
              mountPath: /sql
            - name: initdb
              mountPath: /initdb
      containers:
        - name: mysql
          image: mysql:8.0
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: g18-secret
                  key: DB_PASSWORD
            - name: MYSQL_DATABASE
              value: campus_repair
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: g18-config
                  key: TZ
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: g18-mysql-pvc
        - name: sql
          configMap:
            name: g18-db-init
        - name: initdb
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: g18-mysql
  namespace: enterprise-g18
spec:
  selector:
    app: g18-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
